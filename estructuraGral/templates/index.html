<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsivo a otros dipositivos -->
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link href="//cdn.bootcss.com/noUiSlider/8.5.1/nouislider.min.css" rel="stylesheet">
    <script src="//cdn.bootcss.com/noUiSlider/8.5.1/nouislider.js"></script>
</head>
<body data-appname="{{title}}">
    <!-- Barra superior -->
    <header class="top-bar">
        <button id ="homeBtn">Home</button>
        <button id = "logoutBtn">Logout</button>
    </header>

    <!-- Área central -->
    <main class="content">
        <div class="selector">
            <button id="fileBtn">Select video</button>
            <p id="fileName">No video selected.</p>
            <p class="researcher-info" id="researcherInfo" data-user="{{user}}"></p>
        </div>
        <!-- <input type="file" id="videoFileInput" accept="video/*" style="display:none;"> -->
        <div class="frame-viewer">
            <canvas id="frame-placeholder"></canvas>
            <div class="botones_frame">
                <button id="acceptFrameBtn" class="hidden" disabled>Select frame</button>
                <button id="acceptFramesBtn" class="hidden">Select group of frames</button>
            </div>
            <button id="acceptGroup" class="hidden">Accept group of frames</button>
            <button id="submitBtn" class="hidden" disabled>Submit</button>
        </div>
    </main>
    <div id="videoWindow" class="window hidden">
        <ul id="videoList" class="videoList"></ul>
    </div>
    <!--<div id="evaluator-popup" class="popup hidden">
        <div class="popup-content">
            <label for="evaluator">Evaluator: </label>
            <input type="text" id="evaluator" placeholder="Evaluator Name">
        </div>
        <button id="evaluator-submit">Accept</button>
    </div>-->

    <!-- Video abajo izquierda -->
    <div id="video-container" style="display:none;">
        <video id="video-player"></video>
        <div class="progress-bar">
            <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
        </div>
        <div id="range"></div>
        <div class="frame-controls">
            <button id="prev-frame">⏮</button>
            <button id="play">►</button>
            <button id="pause" class="hidden">⏸</button>
            <button id="next-frame">⏭</button>
        </div>
    </div>

    <!-- Menú lateral (oculto hasta aceptar) -->
    <aside class="sidebar hidden" id="sidebar">
        <div class="quality">
            <button id="qualityGreen" class="quality-button transparent" style="background-color: #4CAF50;">Good</button>
            <button id="qualityYellow" class="quality-button transparent" style="background-color: #FFC107;">Fair</button>
            <button id="qualityRed" class="quality-button transparent" style="background-color: #E53935;">Bad</button>
            <button id="qualityBlack" class="quality-button transparent" style="background-color: #333333;">None</button>
        </div>
        <div class="block">
            <div class="hidden" id="selectZone">Select Zone:</div>
            <div class="zones">
                {% for zone in data.zones %}
                    <label>
                        <input type="radio" name="zone" value="{{ zone.value }}"
                        {% if loop.first %}
                            checked
                        {% endif %}>
                        <span class="check"></span>
                        {{ zone.label }}
                    </label>
                {% endfor %}
            </div>
        </div>
        <div class="block">
            <div>Select Structure:</div>
            {% for structure in data.structures %}
                <div class=" structure-item transparent" data-color="{{structure.color}}">
                    <span class="structure-name" style="color: #1A1A1A">{{ structure.name }}</span>
                    <input type="range" min="1" max="40" value="20" class="brush-slider" style="accent-color: {{ structure.color }};">
                    <button id="delete{{ loop.index }}" class="delete">✖</button>
                </div>
            {% endfor %}

        </div>
    </aside>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
